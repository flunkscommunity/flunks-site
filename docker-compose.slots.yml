version: '3.8'

services:
  slotopol:
    image: schwarzlichtbezirk/slotopol:latest
    container_name: flunks-slots-server
    ports:
      - "8080:8080"
    volumes:
      - ./slots-data:/app/data
      - ./slots-config:/app/config
    environment:
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/slots.db
    restart: unless-stopped
    networks:
      - flunks-network

networks:
  flunks-network:
    driver: bridge

volumes:
  slots-data:
  slots-config:
