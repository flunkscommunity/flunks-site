<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 169.075 244.64">
  <defs>
    <pattern id="cardDiamond" patternUnits="userSpaceOnUse" width="24" height="24">
      <rect width="24" height="24" fill="#b71c1c"/>
      <polygon points="12,0 24,12 12,24 0,12" fill="#d32f2f"/>
      <polygon points="12,4 20,12 12,20 4,12" fill="#b71c1c"/>
    </pattern>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffec8b"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
  </defs>
  <!-- Main card body -->
  <rect width="169.075" height="244.64" rx="12" ry="12" fill="#8b0000"/>
  <!-- Pattern fill -->
  <rect x="6" y="6" width="157.075" height="232.64" rx="10" ry="10" fill="url(#cardDiamond)"/>
  <!-- Gold border -->
  <rect x="12" y="12" width="145.075" height="220.64" rx="8" ry="8" fill="none" stroke="url(#borderGradient)" stroke-width="4"/>
  <!-- Inner decoration -->
  <rect x="24" y="24" width="121.075" height="196.64" rx="6" ry="6" fill="none" stroke="#ffd700" stroke-width="2"/>
  <!-- Center emblem -->
  <ellipse cx="84.5" cy="122.32" rx="35" ry="45" fill="#8b0000" stroke="#ffd700" stroke-width="2"/>
  <text x="84.5" y="112" font-family="serif" font-size="28" font-weight="bold" fill="#ffd700" text-anchor="middle">♠</text>
  <text x="84.5" y="145" font-family="serif" font-size="28" font-weight="bold" fill="#ffd700" text-anchor="middle">♥</text>
</svg>
