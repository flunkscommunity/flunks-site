<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated;">
  <!-- Helmet -->
  <circle cx="32" cy="24" r="18" fill="#FF69B4" stroke="#000" stroke-width="2"/>
  
  <!-- Helmet reflection -->
  <ellipse cx="26" cy="18" rx="4" ry="6" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Face -->
  <circle cx="32" cy="24" r="12" fill="#FFEAA7"/>
  
  <!-- Eyes -->
  <rect x="28" y="20" width="2" height="2" fill="#000"/>
  <rect x="34" y="20" width="2" height="2" fill="#000"/>
  
  <!-- Mouth -->
  <rect x="30" y="26" width="4" height="2" fill="#FF69B4" rx="1"/>
  
  <!-- Body -->
  <rect x="20" y="40" width="24" height="20" fill="#FF69B4" stroke="#000" stroke-width="1"/>
  
  <!-- Body details -->
  <rect x="24" y="46" width="4" height="2" fill="#FFF"/>
  <rect x="30" y="46" width="4" height="2" fill="#FFF"/>
  <rect x="36" y="46" width="4" height="2" fill="#FFF"/>
  <rect x="27" y="50" width="4" height="2" fill="#FFF"/>
  <rect x="33" y="50" width="4" height="2" fill="#FFF"/>
  
  <!-- Arms -->
  <rect x="10" y="42" width="10" height="8" fill="#FF69B4" stroke="#000" stroke-width="1"/>
  <rect x="44" y="42" width="10" height="8" fill="#FF69B4" stroke="#000" stroke-width="1"/>
  
  <!-- Letter F on chest -->
  <rect x="29" y="54" width="6" height="4" fill="#000"/>
  <rect x="29" y="54" width="2" height="4" fill="#FFF"/>
  <rect x="29" y="54" width="4" height="1" fill="#FFF"/>
  <rect x="29" y="56" width="3" height="1" fill="#FFF"/>
</svg>
