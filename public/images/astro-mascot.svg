<svg width="64" height="80" viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated;">
  <!-- Helmet Glass/Visor -->
  <rect x="8" y="8" width="48" height="40" fill="#E6B3FF" stroke="#000" stroke-width="1"/>
  <rect x="12" y="12" width="40" height="32" fill="#F0C4FF"/>
  
  <!-- Helmet Frame -->
  <rect x="6" y="6" width="4" height="44" fill="#000"/>
  <rect x="54" y="6" width="4" height="44" fill="#000"/>
  <rect x="6" y="6" width="52" height="4" fill="#000"/>
  <rect x="6" y="46" width="52" height="4" fill="#000"/>
  
  <!-- Head/Face -->
  <rect x="20" y="16" width="24" height="24" fill="#DEB887"/>
  
  <!-- Hair -->
  <rect x="20" y="16" width="24" height="8" fill="#8B4513"/>
  <rect x="16" y="20" width="4" height="8" fill="#8B4513"/>
  <rect x="44" y="20" width="4" height="8" fill="#8B4513"/>
  
  <!-- Eyes -->
  <rect x="24" y="24" width="4" height="4" fill="#000"/>
  <rect x="36" y="24" width="4" height="4" fill="#000"/>
  <!-- Eye whites -->
  <rect x="25" y="25" width="2" height="2" fill="#FFF"/>
  <rect x="37" y="25" width="2" height="2" fill="#FFF"/>
  
  <!-- Mouth/Breathing apparatus -->
  <rect x="28" y="32" width="8" height="4" fill="#FF69B4"/>
  <rect x="30" y="33" width="4" height="2" fill="#FFF"/>
  
  <!-- Antenna -->
  <rect x="60" y="0" width="2" height="16" fill="#000"/>
  <rect x="58" y="14" width="6" height="2" fill="#FFF"/>
  
  <!-- Body/Suit -->
  <rect x="16" y="50" width="32" height="24" fill="#E6B3FF"/>
  
  <!-- Chest Panel -->
  <rect x="24" y="56" width="16" height="12" fill="#000"/>
  <rect x="26" y="58" width="12" height="8" fill="#666"/>
  
  <!-- Letter F on chest -->
  <rect x="30" y="60" width="4" height="4" fill="#FFF"/>
  <rect x="30" y="60" width="1" height="4" fill="#FFF"/>
  <rect x="30" y="60" width="3" height="1" fill="#FFF"/>
  <rect x="30" y="62" width="2" height="1" fill="#FFF"/>
  
  <!-- Arms -->
  <rect x="8" y="52" width="8" height="16" fill="#E6B3FF"/>
  <rect x="48" y="52" width="8" height="16" fill="#E6B3FF"/>
  
  <!-- Gloves -->
  <rect x="8" y="68" width="8" height="4" fill="#000"/>
  <rect x="48" y="68" width="8" height="4" fill="#000"/>
  
  <!-- Legs -->
  <rect x="20" y="74" width="8" height="6" fill="#E6B3FF"/>
  <rect x="36" y="74" width="8" height="6" fill="#E6B3FF"/>
  
  <!-- Boots -->
  <rect x="18" y="78" width="12" height="2" fill="#000"/>
  <rect x="34" y="78" width="12" height="2" fill="#000"/>
  
  <!-- Helmet details/screws -->
  <rect x="10" y="10" width="2" height="2" fill="#666"/>
  <rect x="52" y="10" width="2" height="2" fill="#666"/>
  <rect x="10" y="44" width="2" height="2" fill="#666"/>
  <rect x="52" y="44" width="2" height="2" fill="#666"/>
</svg>
